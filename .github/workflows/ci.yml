name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build curated dataset
        run: npm run build:data
      - name: Build imported library from committed snapshots
        run: npm run build:library
      - name: Build analysis doc
        run: npm run build:analysis
      - name: Fail if generated artifacts are stale
        run: |
          git diff --exit-code prompts/generated.json prompts/library.json prompts/library-report.json \
            docs/CORPUS-ANALYSIS.md \
            || (echo "::error::generated artifacts are stale — run npm run build and commit the result" && exit 1)
      - name: Refuse incompatible upstream licenses
        run: |
          node -e '
            const lib = require("./prompts/library.json");
            const allowed = new Set(["MIT","Apache-2.0","CC0-1.0","CC BY 4.0"]);
            const bad = lib.sources.filter((s) => !allowed.has(s.license));
            if (bad.length) {
              console.error("::error::Non-importable license(s): " + bad.map((s) => s.id + "=" + s.license).join(", "));
              process.exit(1);
            }
          '
      - name: Lint the library
        run: node bin/cli.mjs validate --all
      - name: Test
        run: npm test

  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
